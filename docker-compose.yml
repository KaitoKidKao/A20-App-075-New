version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: a20-postgres
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app075
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: a20-redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
